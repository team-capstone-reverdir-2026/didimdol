# application-local.yml
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/didimdol}
    username: ${DB_USERNAME:didimdol}
    password: ${DB_PASSWORD:didimdol}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:local-only-secret-local-only-secret-local-only}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


app:
  seed:
    enabled: true
  ai:
    provider: ${AI_PROVIDER:claude}
